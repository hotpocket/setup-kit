# setup-kit per-host answer file for a HEADLESS WORKER — copied to
# hosts/$(hostname).conf by `./bootstrap.sh worker install` on first run.
#
# A worker is a VM (or box) that runs unattended media/AI jobs: TTS, whisper,
# ffmpeg, pushes to AWS. No desktop is used: the box boots to
# multi-user.target, you reach it over ssh, and the only credentials on it are
# machine credentials scoped to its jobs (never SSO tokens, never a YubiKey —
# a cron can't touch one). Same phases as the workstation where they apply;
# see profiles/worker/.

profile=worker
headless=yes                  # phases skip session/launcher/dconf work; verify.sh skips desktop checks
boot_target=multi-user        # multi-user: tty at boot (default) | graphical: the console shows the desktop
# net_dhcp_identifier=mac     # opt-in: stable DHCP identity across cloud-init NIC renames
                             # unset leaves networking alone; components/dhcp-identifier.md

## apt — ONE group. optional/worker.list is the whole set (shell, cloud CLI,
## ffmpeg/sox, pyenv build deps). Every workstation group stays off.
group_worker=yes              # the whole worker apt set — shell, gh/awscli, ffmpeg/sox, pyenv build deps (manifests/apt/optional/worker.list)
group_cli_system=no
group_desktop=no
group_apps=no
group_editors=no
group_media=no                # ffmpeg/sox come from worker.list without the players
group_network=no
group_games=no
group_wine=no
group_dev_core=no             # no docker/cmake/clang; flip on if a job needs them
group_dev_java=no
group_dev_python=no           # build deps are in worker.list
group_dev_cloud=no            # awscli is in worker.list; gcloud is not wanted
group_dev_flutter_deps=no
group_dev_db=no
group_dev_php=no
group_dev_rust=no
group_dev_go=no
group_dev_r=no
group_printing=no
group_extras=no
groups_selected=yes           # no opt-in menu on first install

## conditional groups resolve by detection; override only to force
# cond_nvidia=auto            # the GPU driver: a working driver of ANY version satisfies
# CUDA for kokoro/whisper comes as pip wheels inside their venvs (components/whisper.md);
# the system toolkit is ~4 GB across 130 packages that nothing here calls, and the
# container toolkit only matters with docker. Both stay out.
skip_pkgs=nvidia-cuda-toolkit nvidia-container-toolkit

## disk space preflight
space_check=enforce
disk_headroom_gb=10
review_over_mb=100
size_review_done=yes          # the worker list is curated; no per-package prompt on first install

## components
component_oom_zram=yes        # zram swap + oomd tuning (small-RAM VM insurance)
swap_policy=auto
tmp_on_disk=yes               # preserve existing fstab disk mounts; vendor tmpfs -> disk next reboot
component_resource_guards=auto # below 16 GiB: journal/indexer bounds, watch floors, memory history, kit-heavy
component_uutils_ls=yes       # ls shim (components/uutils-ls.md); self-removes when distro catches up
component_herdr=no
component_ollama=no
component_t3code=no           # opt-in   T3 Code front end for claude on this box (components/t3code.md); a worker is reached from elsewhere, so t3code_host=0.0.0.0 when yes
component_codex=no            # opt-in   OpenAI Codex CLI for t3code (components/codex.md); login by hand: codex login --device-auth
component_whisper=yes         # faster-whisper GPU transcription (components/whisper.md; model ~3 GB)
component_chatterbox=yes      # Chatterbox-TTS venv — what the audiobook line renders with (components/chatterbox.md; ~7 GB)
whisper_model=large-v3
component_claude_code=yes     # Claude Code CLI (native installer)
component_claude_skills=yes
claude_skills="vault conduct" # add gstack with its opt-in Chromium component and headless runtime group
component_docker_rootless=no  # docker isn't installed (group_dev_core=no); irrelevant unless flipped
component_dictation=no        # desktop-only
component_tts=no              # kokoro clipboard-TTS venv (~6 GB torch): a desktop tool; the audiobook line uses Chatterbox
component_ocr=no              # desktop-only
component_mtga=no
# tts (kokoro venv, GPU torch) is ALWAYS provisioned by 07-components — that IS
# the worker's job engine. Only the clipboard player/Flutter client are
# desktop-side and are not wired here.

## language stacks
lang_python=yes               # pyenv 3.12 — the kokoro-tts venv shebangs in .configs need it
lang_node=no
lang_flutter=no

## dotfiles — full keeps the existing worker shell/setup path. Agent-only
## hosts delegate to the .configs role installer without phase 06's fixed
## dotfiles, executable sweep, launchers, autostart or dconf.
configs_role=full             # full: existing personal shell setup | agent: allowlisted headless tools
configs_repo=https://github.com/hotpocket/.configs.git   # https: the gh token serves it (git_auth=token)
# With git_auth=none, use git-hub:.configs.git, a local repo path or bundle file.
# The agent role always delegates install/check; configs_run_setup controls full only.
configs_run_setup=yes

## machine credentials — SEEDED BY HAND, never by the kit (03-headless only
## verifies they work and names what's missing). The aws key is seeded in
## plaintext and SEALED by the kit (seal-aws-profile.sh: systemd-creds blob,
## TPM2 + host key, user-scoped, read via credential_process).
aws_profile=cron-deploy       # named job profile; none (or empty) skips machine AWS credentials
## git — GitHub modes are combinable; none disables them (profiles/worker/lib-deploy-keys.sh):
##   none        No GitHub auth/keys or clone_repos; configs_repo can be a private hub URL, local repo or bundle.
##   token       ONE fine-grained PAT, "only select repositories", placed by hand
##               in github_token_file (mode 600, outside every repo). gh holds it;
##               every https github.com URL just works. A PAT's permissions are
##               uniform across its repos: Contents read-only for a pull-only box,
##               read-and-write only when the job pushes.
##   deploy-keys one read-only deploy key per repo (GitHub: a key opens ONE repo),
##               ssh alias github.com-<name>; deploy_repos="name=owner/repo ...".
##   "deploy-keys token"  both: a repo in deploy_repos clones over its alias,
##               anything else over https via the token. The usual worker shape —
##               .configs read-only by key, the job's repos read-write by PAT.
git_auth=token
github_token_file=~/.config/setup-kit/github-token
# deploy_repos="configs=hotpocket/.configs"     # deploy-keys (then configs_repo=git@github.com-configs:…)
## repos the jobs run from, each cloned into ~/git/<repo> (or ~/git/<path> when
## written owner/repo:path) by the credential that covers it. A parent whose own
## bootstrap clones members needs only itself listed; ssh remotes in its
## manifest are rewritten to https for the token (token_rewrite_ssh).
clone_repos=""                # e.g. hotpocket/audiobook hotpocket/books:landry.bot/books


## git hub (components/git-hub.md): push to bare repos on a hub the human
## controls instead of GitHub. git_hub is the ONE place the hub's address lives
## (the HostName of ssh alias git-hub); moving the hub = change it, re-run install.
# git_hub=hub.lan
# git_hub_repos="hotpocket/books:landry.bot/books hotpocket/wbt"   # clones whose origin becomes git-hub:<name>.git

## Headless build tools (all opt-in; no effect while these keys are no).
group_dev_headless=no         # Ubuntu 26.04 CPU GL, fonts, Xvfb and Playwright 1.62.1 Chromium libraries
component_uv=no               # standalone uv/uvx; manifests/tool-versions.conf pins the vendor checksum
component_blender=no          # official batch renderer; no desktop launcher
component_flutter_headless=no # Flutter + Android CLI/NDK + apt headless JDK21; no Studio/emulator/AVD
component_playwright_chromium=no # phase 08, after gstack build and its existing AppArmor setup
component_emudhra=no          # read-only admission; also raises owned pyenv/pipx trust floors in 04
tmp_age_rule=no               # with tmp_on_disk=yes: exact D /tmp 1777 root root mM:10d, mode 644
