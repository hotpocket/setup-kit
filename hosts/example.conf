# setup-kit per-host answer file — copy to hosts/$(hostname).conf
# Records every choice so re-runs are non-interactive and idempotent.
# Flip any 'no' to 'yes' later and re-run: ./bootstrap.sh workstation install

## whose box. configs=no on a machine that isn't the kit owner's (a friend's):
## no private .configs clone or GitHub-auth preamble, no gpg/pass YubiKey chain,
## no conduct skills or agents; dictation/ocr/tts default off (they serve .configs
## tools). tests/test-no-configs.sh
configs=yes
## dock=no leaves the GNOME dock as the user pinned it; otherwise 06y-dock sets
## it EXACTLY to manifests/dock.list and unpins everything else on each run
dock=yes

## apt groups — DEFAULT = development on a VM + graphics/browsers (needed
## for remote-in sessions and headless chrome testing). Media/wine/games
## are opt-in via the selection menu at first interactive install.
group_cli_system=yes          # base OS glue — snap, themes, fonts, pdf/doc viewers, memtest
group_desktop=yes             # GNOME so the box is usable as a (remote-able) desktop
group_apps=yes                # web browsers + Google Drive mount
group_editors=yes             # code + office editing — vscode, vim/neovim, libreoffice
group_media=no                # play/edit audio/video/graphics + codecs
group_network=yes             # remote-in & net work — ssh server, samba, wireshark/nmap, transmission
group_games=no                # steam + games (off: most targets headless/no dGPU)
group_wine=no                 # Wine for Windows apps (e.g. MTGA — see component_mtga)
wine_branch=stable            # WineHQ branch: stable | devel | staging (devel for fixes not yet in stable, e.g. MTGA mouse capture)
group_dev_core=yes            # C/C++ chain, git/gh/jq, docker, sqlite
group_dev_java=yes            # current JDK + maven
group_dev_python=yes          # pyenv build deps + pip/pipx (interpreters: lang_python)
group_dev_cloud=yes           # cloud CLIs — aws, gcloud
group_dev_flutter_deps=yes    # flutter Linux-desktop build deps + adb udev rules
## optional (OFF by default)
group_dev_db=no               # run a local DB to develop against — MariaDB + PostgreSQL
group_dev_php=no              # PHP runtime for web dev
group_dev_rust=no             # apt rust (stale — prefer rustup; listed for completeness)
group_dev_go=no               # Go — golang-go + gopls/staticcheck
group_dev_r=no                # R — r-base (rstudio dropped; confirm before enabling)
group_printing=no             # CUPS + printer GUI (dev VMs/headless don't need it)

## conditional groups resolve by detection; override only to force
# cond_nvidia=auto            # auto: NVIDIA GPU present AND ubuntu-drivers backs it (legacy cards → nouveau); yes forces, no blocks
# cond_virtualbox=no          # OPT-IN: dkms kernel module + core system changes; yes installs on bare-metal non-proxmox

## verify.sh "system calm" thresholds (post-install behavior checks)
# calm_journal_warns=50       # max journal warnings+errors per 5 min
# calm_load_per_core=50       # max idle load1 per core, ×100 (50 = 0.5/core)
# calm_fork_rate=20           # max process spawns/sec (catches respawn loops)

## size review: packages above this prompt at first install
review_over_mb=100

## disk space preflight (profiles/workstation/00-disk-space.sh) — projects the
## whole install's footprint per filesystem BEFORE anything is downloaded.
## enforce: a shortfall stops the run | warn: report and continue | no: skip
space_check=enforce
disk_headroom_gb=10           # free space to leave unclaimed after the install

## components
component_oom_zram=yes        # stop memory spikes killing the GNOME session — zram swap + oomd tuning (components/oom-zram.md)
swap_policy=auto              # auto: <16G RAM → half-RAM zram + disk overflow >= RAM (rounded up to GiB, pri -2); >=16G keeps quarter-RAM zram (max 8G), zram-only. Or: zram-only | zram+disk
tmp_on_disk=yes               # disk /tmp at NEXT REBOOT; preserve existing fstab mounts; 10-day aged cleanup
component_resource_guards=auto # auto: <16G RAM only; yes/no override. Journal/indexer bounds, inotify, memory history, kit-heavy (components/oom-zram.md)
component_uutils_ls=yes       # shadow `ls` with uutils 0.9.0 — distro 0.8.0 breaks -t sort with --group-directories-first; self-removes when distro catches up (components/uutils-ls.md)
component_clipboard=yes      # GNOME Terminal copy/paste on 26.04: middle-click PRIMARY paste back on + pbcopy/pbpaste/copy in bash (components/clipboard.md)
component_lid_ignore=no      # opt-in   laptop used as a node: ignore lid close (AC, battery, docked) so it stays up with the lid shut (components/lid-ignore.md)
component_herdr=no            # terminal multiplexer for running multiple AI coding agents at once (components/herdr.md)
component_ollama=no           # opt-in   local LLM, pulls the `wat` model (components/ollama.md)
#ollama_model=qwen3-coder:30b  # model `wat` runs (~18 GB); must match alias in .configs/.bash_aliases
component_t3code=no           # opt-in   T3 Code web front end for the coding agents on this box — a user service on t3code_host:t3code_port (components/t3code.md)
# t3code_host=127.0.0.1        # bind address; 0.0.0.0 or the LAN IP to reach it from other devices (then: t3 pair)
# t3code_port=3773
# reach=tailnet                # how this worker is reached. ssh = an agent VM behind its router (agentnet, reached by ssh through it): no tailscale repo, package or daemon; the doctor flags one that is there (a joined tailscale is a path around the router). tests/test-reach.sh
# t3code_tailscale_serve=no    # yes: T3 publishes itself over Tailscale Serve — https://<box>.<tailnet>.ts.net, keep host 127.0.0.1; needs `sudo tailscale set --operator=$USER` + HTTPS certificates on in the tailnet admin console; pair with `t3 pair --tailscale`
component_git_hub=no          # opt-in   bare repos workers push to; you forward to GitHub and deploy (components/git-hub.md)
#git_hub_repos="owner/repo[:path] ..."   # bare <basename>.git per entry; :path = your working clone under $GIT_HOME
#git_hub_pushers=~/path/to/pushers.pub  # one public key per line; rendered with `restrict` into the hub user's authorized_keys
#git_hub_deploy="books=scripts/deploy-site.sh"  # what `git-hub stage <name>` prints — never runs
#git_hub_review_thread=beast-vm:<thread id>     # the ONE standing thread `git-hub release` sends code reviews into
#git_hub_content="bookshelf=books/*/state/*"    # per repo: paths that forward without review (vault/* docs/* always)
#git_hub_token_warn_days=21                      # doctor warns this far ahead of <forward token>.expires
component_codex=no            # opt-in   OpenAI Codex CLI (ChatGPT Plus/Pro/Business) — the second agent t3code fronts; login is yours: codex login --device-auth (components/codex.md)
component_whisper=no          # opt-in   speech-to-text: faster-whisper GPU transcription of yda audio (components/whisper.md; model ~3 GB)
component_chatterbox=no       # opt-in   Chatterbox-TTS venv for the audiobook line (components/chatterbox.md; torch ~5 GB + Turbo weights)
#whisper_model=large-v3        # or distil-large-v3 (faster, English-only); keep in sync with .configs bin/transcribe
component_claude_code=yes     # Claude Code CLI via the native installer (curl claude.ai/install.sh | bash) — the conduct skills need it
component_claude_skills=yes   # clone+link Claude skills (components/{gstack,vault,conduct}.md); implies component_claude_code
component_claude_brevity=no   # opt-in   UserPromptSubmit hook: the brevity rule before every prompt — for configs=no boxes; .configs carries its own (components/claude-brevity.md)
#claude_skills="gstack vault conduct"  # override; unset = gstack + every skill in .configs/claude-conduct/skills
#gstack_skills="browse setup-browser-cookies"  # gstack sub-skills linked beside the router (default shown)

## language stacks (manifests/lang/)
lang_python=yes              # pyenv + Python interpreters (build deps: group_dev_python)
lang_node=yes                # Node.js via nvm + npm
lang_flutter=yes              # includes Android Studio + emulator (needs /dev/kvm)

## YubiKey OpenPGP keys — ALL fingerprints (primary + backup), space-separated;
## the pass store is encrypted to every one so either card can decrypt
# gpg_key_fpr=8733634755706236EF6E1052D9259AC1BF0910D1 7BF67A998A2E7896B0752B37B65E1E766C230F61

## dotfiles
configs_role=full             # full: existing personal shell/desktop setup | agent: allowlisted headless tools
# git_user_name=                # agent role: global git author (no .configs .gitconfig); unset = no change
# git_user_email=
configs_repo=git@github.com:hotpocket/.configs.git
# The agent role always delegates install/check; configs_run_setup controls full only.
configs_run_setup=yes
group_extras=no               # niche/occasional tools (or install piecemeal)
component_docker_rootless=yes # user dockerd, rootful disabled. no to use rootful
# These three default on, or off when configs=no; uncomment to override.
#component_tts=yes            # clipboard TTS — kokoro server venv (~6 GB, torch); the .configs client needs it. no = skip (workers)
#component_dictation=yes      # speak-to-type — offline voice dictation, nerd-dictation + vosk (CPU; ~205MB model)
#component_ocr=yes            # grab text off the screen — select region → OCR → clipboard (ocrscr: tesseract + capture deps)
component_mtga=no             # opt-in   MTG Arena under Wine; needs group_wine=yes (components/mtga.md)
# component_tts controls both the kokoro server and Flutter client; .configs
# ships the client source and needs the backend venv when TTS is enabled.
group_dev_k8s=no              # minikube + future k8s tools (optional)

## Headless build tools (all opt-in; no effect while these keys are no).
group_dev_headless=no         # Ubuntu 26.04 CPU GL, fonts, Xvfb and Playwright 1.62.1 Chromium libraries
component_uv=no               # standalone uv/uvx; manifests/tool-versions.conf pins the vendor checksum
component_blender=no          # official batch renderer; no desktop launcher
component_flutter_headless=no # Flutter + Android CLI/NDK + apt headless JDK21; no Studio/emulator/AVD
component_playwright_chromium=no # phase 08, after gstack build and its existing AppArmor setup
component_iphone_webkit=no     # phase 08: .configs bin/iphone --check, --setup if not ready (pinned Playwright + WebKit)
component_emudhra=no          # read-only admission; also raises owned pyenv/pipx trust floors in 04
tmp_age_rule=no               # with tmp_on_disk=yes: exact D /tmp 1777 root root mM:10d, mode 644
