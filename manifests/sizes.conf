# Declared disk footprints for everything the kit installs that apt can't
# measure for us. Read by profiles/workstation/00-disk-space.sh.
#
# WHY DECLARED: apt knows exactly what its packages cost (Installed-Size, deps
# resolved) and the preflight asks it directly — those never appear here. The
# rest (SDK tarballs, git clones, model weights, vendor .debs) publish no size
# until you're already downloading them, so the only preflight number available
# is a written-down one. Every row says where its number came from; a row whose
# provenance is "guess" is a row to go measure.
#
# Format:  key  size  target  # note
#   size    K/M/G suffix (bare number = KiB)
#   target  ROOT (/usr) | VAR (/var) | HOME | an absolute path
# Unknown keys are ignored; a missing key falls back to the *_default row.
#
# KEEP THESE HONEST: after a real install, `du -sh` the target and correct the
# row. An estimate nobody revisits is how a preflight starts lying.

# ---- language stacks (manifests/lang/) — phases 04, 05
lang_python        1200M  HOME   # pyenv + ONE CPython build: sources+build tree ~800M, installed ~350M
lang_python_pipx    250M  HOME   # pipx venvs: poetry, yt-dlp
lang_node           700M  HOME   # nvm + LTS ~180M (measured .nvm 579M w/ extra versions) + npm globals (aws-cdk is most of it)
lang_flutter       3500M  HOME   # flutter stable clone + pub cache + engine artifacts (measured: 1.6G fresh, grows with build caches)
lang_android      10000M  HOME   # Studio ~4.5G + emulator ~1.2G + one x86_64 system image ~1.8G + AVD ~2G + build-tools
lang_go             800M  HOME   # toolchain + gopls/staticcheck module cache
lang_rust          1500M  HOME   # rustup + one stable toolchain + registry cache

# ---- snaps — phase 03 (live `snap info` size is preferred; these are the fallback)
snap_default        200M  VAR    # a mid-size snap when the store can't be queried
snap_bases         1500M  VAR    # core/core22/core24/gnome-*/mesa/gtk-common-themes — charged ONCE, on a box with no snaps yet

# ---- flatpaks — phase 03
flatpak_default    1200M  VAR    # app + its runtime share on first install (bottles + freedesktop/wine runtimes)

# ---- vendor .debs — manifests/debs.list, phase 02b
deb_default         250M  ROOT
deb_zoom            400M  ROOT
deb_discord         350M  ROOT
deb_obsidian        400M  ROOT
deb_minikube        130M  ROOT
deb_amdgpu-top       15M  ROOT

# ---- components — phase 07 (components/*.md)
component_ollama  20000M  VAR    # binary+libs ~1.5G, then `wat` model qwen3-coder:30b ~18G (components/ollama.md)
component_whisper  4000M  HOME   # faster-whisper venv ~1G + large-v3 weights ~3G into ~/.cache/huggingface (components/whisper.md)
component_dictation 400M  HOME   # nerd-dictation + vosk model ~205M (host conf comment)
component_ocr       150M  ROOT   # tesseract + language data + capture deps
component_tts      3000M  HOME   # kokoro server venv (torch) + voice weights
component_mtga    15000M  HOME   # ~14G game client into ~/.wine, downloaded by Arena's own installer (components/mtga.md)
component_herdr     200M  HOME
component_claude_skills 300M HOME  # skill repo clones

# ---- always-on, not flag-gated
configs_repo        200M  HOME   # ~/git/.configs clone + what its setup.sh fetches
apt_lists           500M  VAR    # /var/lib/apt/lists after the repos in 01 are added
